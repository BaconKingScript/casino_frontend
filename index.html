<!DOCTYPE html>
<html>
<head>
  <title>AetherBet</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background:
        radial-gradient(circle at 20% 10%, rgba(0,245,255,0.08), transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(108,43,217,0.10), transparent 45%),
        #05060a;
      color: white;
      overflow: hidden;
    }

    .topbar {
      height: 56px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 18px;
      background: rgba(10,12,18,0.75);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .logo {
      color: #00f5ff;
      font-weight: bold;
      cursor: pointer;
    }

    .wallet {
      font-size: 12px;
      opacity: 0.8;
    }

    .layout {
      display: flex;
      height: calc(100vh - 56px);
    }

    .sidebar {
      width: 180px;
      padding: 12px;
      background: rgba(10,12,18,0.5);
      border-right: 1px solid rgba(255,255,255,0.05);
    }

    .nav {
      padding: 10px;
      font-size: 12px;
      cursor: pointer;
      opacity: 0.7;
    }

    .nav:hover {
      opacity: 1;
      background: rgba(0,245,255,0.08);
    }

    .main {
      flex: 1;
      padding: 18px;
    }

    .page {
      display: none;
    }

    .active {
      display: block;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .card {
      height: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
    }

    input {
      padding: 10px;
      border-radius: 10px;
      border: none;
      background: rgba(255,255,255,0.05);
      color: white;
      margin-top: 10px;
    }

    button {
      padding: 10px 15px;
      margin-top: 10px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: linear-gradient(90deg, #6c2bd9, #00f5ff);
      color: white;
    }
  </style>
</head>

<body>

<!-- TOP -->
<div class="topbar">
  <div class="logo" onclick="go('home')">AETHERBET</div>
  <div class="wallet">Balance: <span id="bal">100</span></div>
</div>

<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="nav" onclick="go('home')">Home</div>
    <div class="nav" onclick="go('dice')">Dice</div>
    <div class="nav" onclick="go('crash')">Crash</div>
    <div class="nav" onclick="go('slots')">Slots</div>
    <div class="nav" onclick="go('mines')">Mines</div>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- HOME -->
    <div id="home" class="page active">
      <h2>Games</h2>
      <div class="grid">
        <div class="card" onclick="go('dice')">🎲 Dice</div>
        <div class="card" onclick="go('crash')">🚀 Crash</div>
        <div class="card" onclick="go('slots')">🎰 Slots</div>
        <div class="card" onclick="go('mines')">💣 Mines</div>
      </div>
    </div>

    <!-- DICE -->
    <div id="dice" class="page">
      <h2>Dice</h2>
      <input id="bet" type="number" placeholder="Bet">
      <button onclick="dice()">Roll</button>
      <p id="diceRes"></p>
    </div>

    <!-- CRASH -->
    <div id="crash" class="page">
      <h2>Crash</h2>
      <button onclick="crash()">Start</button>
      <p id="crashRes"></p>
    </div>

    <!-- SLOTS -->
    <div id="slots" class="page">
      <h2>Slots</h2>
      <button onclick="slots()">Spin</button>
      <p id="slotsRes"></p>
    </div>

    <!-- MINES -->
    <div id="mines" class="page">
      <h2>Mines</h2>

      <input id="mineBet" type="number" placeholder="Bet">
      <button onclick="startMines()">Start</button>

      <p id="mineInfo"></p>

      <div id="mineGrid" style="display:grid;grid-template-columns:repeat(5,50px);gap:8px;margin-top:10px;"></div>

      <p id="mineResult"></p>
    </div>

  </div>
</div>

<!-- ================= JAVASCRIPT GOES HERE ================= -->
<script>

let balance = 100;
let mines = [];
let gameOn = false;
let bet = 0;
let revealed = 0;

/* BALANCE */
function updateBalance() {
  document.getElementById("bal").innerText = balance;
}

/* NAV */
function go(page) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(page).classList.add("active");
}

/* DICE */
function dice() {
  let bet = Number(document.getElementById("bet").value);
  if (!bet || bet > balance) return;

  let roll = Math.random() * 100;

  if (roll < 50) {
    balance += bet;
    document.getElementById("diceRes").innerText = "WIN " + roll.toFixed(2);
  } else {
    balance -= bet;
    document.getElementById("diceRes").innerText = "LOSE " + roll.toFixed(2);
  }

  updateBalance();
}

/* CRASH */
function crash() {
  let x = (Math.random() * 5 + 1).toFixed(2);
  document.getElementById("crashRes").innerText = "x" + x;
}

/* SLOTS */
function slots() {
  let s = ["🍒","💎","7","🍋"];
  let a = s[Math.floor(Math.random()*s.length)];
  let b = s[Math.floor(Math.random()*s.length)];
  let c = s[Math.floor(Math.random()*s.length)];

  let res = a + " " + b + " " + c;

  if (a === b && b === c) {
    balance += 20;
    document.getElementById("slotsRes").innerText = res + " JACKPOT +20";
  } else {
    balance -= 5;
    document.getElementById("slotsRes").innerText = res + " -5";
  }

  updateBalance();
}

/* MINES */
function startMines() {
  bet = Number(document.getElementById("mineBet").value);
  if (!bet || bet > balance) return;

  balance -= bet;
  updateBalance();

  mines = [];
  revealed = 0;
  gameOn = true;

  document.getElementById("mineResult").innerText = "";
  document.getElementById("mineInfo").innerText = "Avoid bombs!";

  // create grid
  for (let i = 0; i < 25; i++) mines.push(false);

  // place bombs
  let bombs = 5;
  while (bombs > 0) {
    let i = Math.floor(Math.random() * 25);
    if (!mines[i]) {
      mines[i] = true;
      bombs--;
    }
  }

  renderMines();
}

function renderMines() {
  const grid = document.getElementById("mineGrid");
  grid.innerHTML = "";

  for (let i = 0; i < 25; i++) {
    let btn = document.createElement("button");

    btn.style.width = "50px";
    btn.style.height = "50px";
    btn.innerText = "?";

    btn.onclick = () => clickMine(i, btn);

    grid.appendChild(btn);
  }
}

function clickMine(i, btn) {
  if (!gameOn) return;

  if (mines[i]) {
    btn.innerText = "💣";
    btn.style.background = "red";
    document.getElementById("mineResult").innerText = "YOU LOST";
    gameOn = false;
    revealAll();
    return;
  }

  btn.innerText = "💎";
  btn.style.background = "green";
  btn.disabled = true;

  revealed++;

  document.getElementById("mineResult").innerText =
    "Safe! tiles: " + revealed;
}

function revealAll() {
  let buttons = document.querySelectorAll("#mineGrid button");
  buttons.forEach((b, i) => {
    if (mines[i]) b.innerText = "💣";
  });
}

updateBalance();
go("home");

</script>

</body>
</html>
