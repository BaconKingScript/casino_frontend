<!DOCTYPE html>
<html>
<head>
  <title>AetherBet</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: radial-gradient(circle at 20% 10%, rgba(0,245,255,0.08), transparent 40%),
                  radial-gradient(circle at 80% 20%, rgba(108,43,217,0.10), transparent 45%),
                  #05060a;
      color: white;
      overflow: hidden;
    }

    .topbar {
      height: 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      background: rgba(10,12,18,0.75);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .logo {
      color: #00f5ff;
      font-weight: bold;
      letter-spacing: 2px;
      cursor: pointer;
    }

    .layout {
      display: flex;
      height: calc(100vh - 50px);
    }

    /* LEFT PANEL (STAKE STYLE CONTROLS) */
    .left {
      width: 280px;
      padding: 14px;
      background: rgba(10,12,18,0.6);
      border-right: 1px solid rgba(255,255,255,0.05);
    }

    .section {
      margin-bottom: 12px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 8px;
      border: none;
      background: rgba(255,255,255,0.05);
      color: white;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: linear-gradient(90deg,#6c2bd9,#00f5ff);
      color: white;
    }

    .toggle {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      opacity: 0.8;
      margin-top: 6px;
    }

    /* RIGHT SIDE GAME */
    .right {
      flex: 1;
      padding: 18px;
    }

    .page { display: none; }
    .active { display: block; }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 50px);
      gap: 8px;
    }

    .tile {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: rgba(255,255,255,0.05);
      color: white;
    }

    .nav {
      font-size: 12px;
      opacity: 0.7;
      cursor: pointer;
      margin: 6px 0;
    }

    .nav:hover {
      opacity: 1;
    }
  </style>
</head>

<body>

<div class="topbar">
  <div class="logo" onclick="go('dice')">AETHERBET</div>
  <div>Balance: <span id="bal">100</span></div>
</div>

<div class="layout">

  <!-- LEFT CONTROL PANEL -->
  <div class="left">

    <div class="section">
      <div class="nav" onclick="go('dice')">Dice</div>
      <div class="nav" onclick="go('crash')">Crash</div>
      <div class="nav" onclick="go('slots')">Slots</div>
      <div class="nav" onclick="go('mines')">Mines</div>
    </div>

    <div class="section">
      <input id="bet" type="number" placeholder="Bet amount">

      <div class="toggle">
        <span>AutoBet</span>
        <input type="checkbox" id="auto">
      </div>

      <button onclick="runGame()">Play</button>
    </div>

    <p id="info"></p>

  </div>

  <!-- RIGHT GAME AREA -->
  <div class="right">

    <div id="dice" class="page active">
      <h2>Dice</h2>
      <p id="diceRes"></p>
    </div>

    <div id="crash" class="page">
      <h2>Crash</h2>
      <p id="crashRes"></p>
    </div>

    <div id="slots" class="page">
      <h2>Slots</h2>
      <p id="slotsRes"></p>
    </div>

    <div id="mines" class="page">
      <h2>Mines</h2>

      <input id="mineCount" type="number" value="3" placeholder="Mines">

      <button onclick="startMines()">Start Mines</button>
      <button onclick="cashout()" id="cashBtn" disabled>Cashout</button>

      <p id="mult">x1.00</p>

      <div id="grid" class="grid"></div>

      <p id="mineRes"></p>
    </div>

  </div>
</div>

<script>

let balance = 100;
let mode = "dice";
let auto = false;

/* NAV */
function go(p){
  mode = p;
  document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
  document.getElementById(p).classList.add("active");
}

/* BAL */
function update(){
  document.getElementById("bal").innerText = balance;
}

/* MAIN RUN */
function runGame(){
  auto = document.getElementById("auto").checked;

  play();

  if(auto){
    let i = setInterval(()=>{
      if(!auto) clearInterval(i);
      play();
    }, 1200);
  }
}

/* GAME ROUTER */
function play(){
  let bet = Number(document.getElementById("bet").value);
  if(!bet || bet > balance) return;

  if(mode === "dice") dice(bet);
  if(mode === "crash") crash(bet);
  if(mode === "slots") slots(bet);
}

/* DICE */
function dice(bet){
  let r = Math.random()*100;

  if(r < 50){
    balance += bet;
    document.getElementById("diceRes").innerText = "WIN " + r.toFixed(2);
  } else {
    balance -= bet;
    document.getElementById("diceRes").innerText = "LOSE " + r.toFixed(2);
  }

  update();
}

/* CRASH */
function crash(bet){
  let x = Math.random()*5+1;

  if(x > 2){
    balance += bet * x;
    document.getElementById("crashRes").innerText = "WIN x" + x.toFixed(2);
  } else {
    balance -= bet;
    document.getElementById("crashRes").innerText = "LOSE x" + x.toFixed(2);
  }

  update();
}

/* SLOTS */
function slots(bet){
  let s=["🍒","💎","7","🍋"];

  let a=s[Math.floor(Math.random()*s.length)];
  let b=s[Math.floor(Math.random()*s.length)];
  let c=s[Math.floor(Math.random()*s.length)];

  let r=a+b+c;

  if(a===b&&b===c){
    balance += bet*3;
    document.getElementById("slotsRes").innerText = r+" WIN";
  } else {
    balance -= bet;
    document.getElementById("slotsRes").innerText = r+" LOSE";
  }

  update();
}

/* MINES */
let mines=[],bet=0,mult=1,gameOn=false,rev=0;

function startMines(){
  bet = Number(document.getElementById("bet").value);
  let m = Number(document.getElementById("mineCount").value);

  if(!bet || bet > balance) return;

  balance -= bet;
  update();

  mines=[];rev=0;mult=1;gameOn=true;

  document.getElementById("cashBtn").disabled=false;
  document.getElementById("mineRes").innerText="";

  for(let i=0;i<25;i++) mines[i]=false;

  let p=0;
  while(p<m){
    let i=Math.floor(Math.random()*25);
    if(!mines[i]){mines[i]=true;p++;}
  }

  render();
}

function render(){
  let g=document.getElementById("grid");
  g.innerHTML="";

  for(let i=0;i<25;i++){
    let b=document.createElement("button");
    b.className="tile";
    b.innerText="?";
    b.onclick=()=>click(i,b);
    g.appendChild(b);
  }
}

function click(i,b){
  if(!gameOn) return;

  if(mines[i]){
    b.innerText="💣";
    document.getElementById("mineRes").innerText="LOSE";
    gameOn=false;
    reveal();
    return;
  }

  b.innerText="💎";
  b.disabled=true;

  rev++;
  mult = 1 + rev * 0.4;

  document.getElementById("mult").innerText="x"+mult.toFixed(2);
}

function cashout(){
  if(!gameOn) return;

  balance += bet * mult;
  update();

  document.getElementById("mineRes").innerText="CASHED OUT";
  gameOn=false;
  document.getElementById("cashBtn").disabled=true;
}

function reveal(){
  document.querySelectorAll("#grid button").forEach((b,i)=>{
    if(mines[i]) b.innerText="💣";
  });
}

update();

</script>

</body>
</html>
