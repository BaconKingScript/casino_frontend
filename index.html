<!DOCTYPE html>
<html>
<head>
  <title>AetherBet</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background:
        radial-gradient(circle at 20% 10%, rgba(0,245,255,0.08), transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(108,43,217,0.10), transparent 45%),
        #05060a;
      color: white;
      overflow: hidden;
    }

    .topbar {
      height: 56px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 18px;
      background: rgba(10,12,18,0.75);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .logo {
      color: #00f5ff;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 2px;
    }

    .wallet {
      font-size: 12px;
      opacity: 0.8;
    }

    .layout {
      display: flex;
      height: calc(100vh - 56px);
    }

    .sidebar {
      width: 180px;
      padding: 12px;
      background: rgba(10,12,18,0.5);
    }

    .nav {
      padding: 10px;
      cursor: pointer;
      opacity: 0.7;
    }

    .nav:hover {
      opacity: 1;
      background: rgba(0,245,255,0.08);
    }

    .main {
      flex: 1;
      padding: 18px;
    }

    .page { display: none; }
    .active { display: block; }

    input {
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: rgba(255,255,255,0.05);
      color: white;
      margin-top: 8px;
    }

    button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: linear-gradient(90deg,#6c2bd9,#00f5ff);
      color: white;
      margin-top: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .card {
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.03);
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="topbar">
  <div class="logo" onclick="go('home')">AETHERBET</div>
  <div class="wallet">Balance: <span id="bal">100</span></div>
</div>

<div class="layout">

  <div class="sidebar">
    <div class="nav" onclick="go('home')">Home</div>
    <div class="nav" onclick="go('dice')">Dice</div>
    <div class="nav" onclick="go('crash')">Crash</div>
    <div class="nav" onclick="go('slots')">Slots</div>
    <div class="nav" onclick="go('mines')">Mines</div>
  </div>

  <div class="main">

    <!-- HOME -->
    <div id="home" class="page active">
      <h2>Games</h2>
      <div class="grid">
        <div class="card" onclick="go('dice')">Dice</div>
        <div class="card" onclick="go('crash')">Crash</div>
        <div class="card" onclick="go('slots')">Slots</div>
        <div class="card" onclick="go('mines')">Mines</div>
      </div>
    </div>

    <!-- DICE -->
    <div id="dice" class="page">
      <h2>Dice</h2>
      <input id="bet" type="number" placeholder="Bet">
      <button onclick="dice()">Roll</button>
      <p id="diceRes"></p>
    </div>

    <!-- CRASH -->
    <div id="crash" class="page">
      <h2>Crash</h2>
      <input id="bet2" type="number" placeholder="Bet">
      <button onclick="crash()">Start</button>
      <p id="crashRes"></p>
    </div>

    <!-- SLOTS -->
    <div id="slots" class="page">
      <h2>Slots</h2>
      <input id="bet3" type="number" placeholder="Bet">
      <button onclick="slots()">Spin</button>
      <p id="slotsRes"></p>
    </div>

    <!-- MINES -->
    <div id="mines" class="page">
      <h2>Mines</h2>

      <input id="mineBet" type="number" placeholder="Bet">
      <input id="mineCount" type="number" value="3" placeholder="Mines">

      <button onclick="startMines()">Start</button>
      <button onclick="cashout()" id="cashBtn" disabled>Cashout</button>

      <p id="mult">Multiplier: x1.00</p>

      <div id="grid" style="display:grid;grid-template-columns:repeat(5,50px);gap:8px;margin-top:10px;"></div>

      <p id="mineRes"></p>
    </div>

  </div>
</div>

<script>

let balance = 100;

/* NAV */
function go(p){
  document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
  document.getElementById(p).classList.add("active");
}

/* BAL */
function updateBal(){
  document.getElementById("bal").innerText = balance;
}

/* DICE */
function dice(){
  let b=Number(document.getElementById("bet").value);
  if(!b||b>balance)return;

  let r=Math.random()*100;

  if(r<50){balance+=b;document.getElementById("diceRes").innerText="WIN "+r.toFixed(2);}
  else{balance-=b;document.getElementById("diceRes").innerText="LOSE "+r.toFixed(2);}

  updateBal();
}

/* CRASH */
function crash(){
  let b=Number(document.getElementById("bet2").value);
  if(!b||b>balance)return;

  let x=Math.random()*5+1;

  if(x>2){balance+=b*x;document.getElementById("crashRes").innerText="WIN x"+x.toFixed(2);}
  else{balance-=b;document.getElementById("crashRes").innerText="LOSE x"+x.toFixed(2);}

  updateBal();
}

/* SLOTS */
function slots(){
  let b=Number(document.getElementById("bet3").value);
  if(!b||b>balance)return;

  let s=["🍒","💎","7","🍋"];
  let a=s[Math.floor(Math.random()*s.length)];
  let c=s[Math.floor(Math.random()*s.length)];
  let d=s[Math.floor(Math.random()*s.length)];

  let res=a+c+d;

  if(a===c&&c===d){balance+=b*3;document.getElementById("slotsRes").innerText=res+" WIN";}
  else{balance-=b;document.getElementById("slotsRes").innerText=res+" LOSE";}

  updateBal();
}

/* MINES */
let mines=[],bet=0,mineCount=3,gameOn=false,revealed=0,mult=1;

function startMines(){
  bet=Number(document.getElementById("mineBet").value);
  mineCount=Number(document.getElementById("mineCount").value);

  if(!bet||bet>balance)return;

  balance-=bet;
  updateBal();

  mines=[];revealed=0;mult=1;gameOn=true;

  document.getElementById("cashBtn").disabled=false;
  document.getElementById("mineRes").innerText="";

  for(let i=0;i<25;i++)mines[i]=false;

  let p=0;
  while(p<mineCount){
    let i=Math.floor(Math.random()*25);
    if(!mines[i]){mines[i]=true;p++;}
  }

  render();
  updateMult();
}

function render(){
  let g=document.getElementById("grid");
  g.innerHTML="";

  for(let i=0;i<25;i++){
    let b=document.createElement("button");
    b.innerText="?";
    b.onclick=()=>click(i,b);
    g.appendChild(b);
  }
}

function click(i,b){
  if(!gameOn)return;

  if(mines[i]){
    b.innerText="💣";
    document.getElementById("mineRes").innerText="LOSE";
    gameOn=false;
    reveal();
    return;
  }

  b.innerText="💎";
  b.disabled=true;

  revealed++;

  mult=1+revealed*0.35;
  updateMult();
}

function updateMult(){
  document.getElementById("mult").innerText="Multiplier: x"+mult.toFixed(2);
}

function cashout(){
  if(!gameOn)return;

  balance+=bet*mult;
  updateBal();

  document.getElementById("mineRes").innerText="CASHED OUT";
  gameOn=false;
  document.getElementById("cashBtn").disabled=true;
}

function reveal(){
  let bs=document.querySelectorAll("#grid button");
  bs.forEach((b,i)=>{if(mines[i])b.innerText="💣";});
}

updateBal();

</script>

</body>
</html>
