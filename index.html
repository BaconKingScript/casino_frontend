<!DOCTYPE html>
<html>
<head>
  <title>AetherBet</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: radial-gradient(circle at 20% 10%, rgba(0,245,255,0.08), transparent 40%),
                  radial-gradient(circle at 80% 20%, rgba(108,43,217,0.10), transparent 45%),
                  #05060a;
      color: white;
    }

    .topbar {
      height: 52px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      background: rgba(10,12,18,0.75);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .layout {
      display: flex;
      height: calc(100vh - 52px);
    }

    /* LEFT PANEL (BET SYSTEM ONLY) */
    .left {
      width: 260px;
      padding: 14px;
      background: rgba(10,12,18,0.6);
      border-right: 1px solid rgba(255,255,255,0.05);
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      background: rgba(255,255,255,0.05);
      color: white;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: linear-gradient(90deg,#6c2bd9,#00f5ff);
      color: white;
    }

    .nav {
      padding: 8px;
      cursor: pointer;
      opacity: 0.7;
    }

    .nav:hover { opacity: 1; }

    /* RIGHT GAME AREA */
    .right {
      flex: 1;
      padding: 18px;
    }

    .page { display: none; }
    .active { display: block; }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 50px);
      gap: 8px;
    }

    .tile {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: rgba(255,255,255,0.05);
      color: white;
    }
  </style>
</head>

<body>

<div class="topbar">
  <div>AETHERBET</div>
  <div>Balance: <span id="bal">100</span></div>
</div>

<div class="layout">

  <!-- LEFT: BETTING -->
  <div class="left">

    <div class="nav" onclick="setGame('dice')">Dice</div>
    <div class="nav" onclick="setGame('crash')">Crash</div>
    <div class="nav" onclick="setGame('slots')">Slots</div>
    <div class="nav" onclick="setGame('mines')">Mines</div>

    <input id="bet" type="number" placeholder="Enter bet">

    <button onclick="play()">Play</button>

    <p id="info"></p>
  </div>

  <!-- RIGHT: GAME -->
  <div class="right">

    <div id="dice" class="page active">
      <h2>Dice</h2>
      <p id="res"></p>
    </div>

    <div id="crash" class="page">
      <h2>Crash</h2>
      <p id="res"></p>
    </div>

    <div id="slots" class="page">
      <h2>Slots</h2>
      <p id="res"></p>
    </div>

    <div id="mines" class="page">
      <h2>Mines</h2>
      <p id="res"></p>
    </div>

  </div>

</div>

<script>

let balance = 100;
let game = "dice";

function setGame(g) {
  game = g;

  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(g).classList.add("active");
}

/* UPDATE BAL */
function update() {
  document.getElementById("bal").innerText = balance;
}

/* MAIN BET */
function play() {
  let bet = Number(document.getElementById("bet").value);
  if (!bet || bet <= 0 || bet > balance) return;

  if (game === "dice") dice(bet);
  if (game === "crash") crash(bet);
  if (game === "slots") slots(bet);
  if (game === "mines") mines(bet);
}

/* DICE */
function dice(bet) {
  let r = Math.random() * 100;

  if (r < 50) {
    balance += bet;
    document.getElementById("res").innerText = "WIN " + r.toFixed(2);
  } else {
    balance -= bet;
    document.getElementById("res").innerText = "LOSE " + r.toFixed(2);
  }

  update();
}

/* CRASH */
function crash(bet) {
  let x = Math.random() * 5 + 1;

  if (x > 2) {
    balance += bet * x;
    document.getElementById("res").innerText = "WIN x" + x.toFixed(2);
  } else {
    balance -= bet;
    document.getElementById("res").innerText = "LOSE x" + x.toFixed(2);
  }

  update();
}

/* SLOTS */
function slots(bet) {
  let s = ["🍒", "💎", "7"];

  let a = s[Math.floor(Math.random() * 3)];
  let b = s[Math.floor(Math.random() * 3)];
  let c = s[Math.floor(Math.random() * 3)];

  let r = a + b + c;

  if (a === b && b === c) {
    balance += bet * 5;
    document.getElementById("res").innerText = r + " WIN";
  } else {
    balance -= bet;
    document.getElementById("res").innerText = r + " LOSE";
  }

  update();
}

/* MINES (SIMPLE VERSION) */
function mines(bet) {
  let win = Math.random() > 0.4;

  if (win) {
    balance += bet * 2;
    document.getElementById("res").innerText = "SAFE WIN";
  } else {
    balance -= bet;
    document.getElementById("res").innerText = "BOMB";
  }

  update();
}

update();

</script>

</body>
</html>
