<!DOCTYPE html>
<html>
<head>
  <title>AetherBet</title>

  <style>
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(0,245,255,0.08), transparent 40%),
        radial-gradient(circle at 85% 10%, rgba(108,43,217,0.10), transparent 45%),
        #05060a;
      color: white;
      overflow-x: hidden;
    }

    /* TOP BAR */
    .topbar {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: rgba(10,12,18,0.75);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .logo {
      font-weight: 700;
      letter-spacing: 4px;
      color: #00f5ff;
      font-size: 13px;
    }

    .wallet {
      font-size: 12px;
      opacity: 0.8;
    }

    /* LAYOUT */
    .layout {
      display: flex;
      height: calc(100vh - 60px);
    }

    /* SIDEBAR */
    .sidebar {
      width: 190px;
      padding: 14px;
      background: rgba(10,12,18,0.55);
      border-right: 1px solid rgba(255,255,255,0.04);
      backdrop-filter: blur(14px);
    }

    .nav {
      padding: 10px;
      font-size: 12px;
      opacity: 0.7;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.15s;
    }

    .nav:hover {
      background: rgba(0,245,255,0.08);
      opacity: 1;
    }

    /* MAIN */
    .main {
      flex: 1;
      padding: 20px;
    }

    .title {
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 15px;
    }

    /* GAME GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .card {
      height: 130px;
      border-radius: 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(0,245,255,0.25);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, #6c2bd9, #00f5ff);
      opacity: 0.7;
    }

    /* RIGHT PANEL */
    .right {
      width: 210px;
      padding: 14px;
      background: rgba(10,12,18,0.55);
      border-left: 1px solid rgba(255,255,255,0.04);
      backdrop-filter: blur(14px);
    }

    .live-title {
      font-size: 12px;
      opacity: 0.6;
      margin-bottom: 10px;
    }

    .live {
      font-size: 11px;
      opacity: 0.6;
      margin: 8px 0;
    }

    /* HERO */
    .hero {
      margin-bottom: 18px;
    }

    .hero h1 {
      font-size: 22px;
      margin: 0;
      color: #00f5ff;
      letter-spacing: 2px;
    }

    .hero p {
      font-size: 12px;
      opacity: 0.6;
      margin-top: 5px;
    }
  </style>
</head>

<body>

  <!-- TOP -->
  <div class="topbar">
    <div class="logo">AETHERBET</div>
    <div class="wallet">Wallet: 100</div>
  </div>

  <!-- BODY -->
  <div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="nav">Home</div>
      <div class="nav">Dice</div>
      <div class="nav">Crash</div>
      <div class="nav">Slots</div>
      <div class="nav">Plinko</div>
    </div>

    <!-- MAIN -->
    <div class="main">

      <div class="hero">
        <h1>Play Beyond Reality</h1>
        <p>Cosmic casino experience powered by AetherBet</p>
      </div>

      <div class="title">Games</div>

      <div class="grid">
        <div class="card">🎲 Dice</div>
        <div class="card">🚀 Crash</div>
        <div class="card">🎰 Slots</div>
        <div class="card">⚡ Plinko</div>
        <div class="card">🌌 Roulette</div>
        <div class="card">🪐 Mines</div>
      </div>

    </div>

    <!-- RIGHT -->
    <div class="right">
      <div class="live-title">Live Wins</div>
      <div class="live">Nova hit 2.4x</div>
      <div class="live">Astra won 5.1x</div>
      <div class="live">Void hit 1.8x</div>
    </div>

  </div>

</body>
</html>
