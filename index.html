<!DOCTYPE html>
<html>
<head>
  <title>AetherBet</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background:
        radial-gradient(circle at 20% 10%, rgba(0,245,255,0.08), transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(108,43,217,0.10), transparent 45%),
        #05060a;
      color: white;
      overflow: hidden;
    }

    /* TOPBAR */
    .topbar {
      height: 56px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 18px;
      background: rgba(10,12,18,0.75);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
    }

    .logo {
      font-weight: 700;
      letter-spacing: 3px;
      color: #00f5ff;
      cursor: pointer;
    }

    .wallet {
      font-size: 12px;
      opacity: 0.8;
    }

    /* LAYOUT */
    .layout {
      display: flex;
      height: calc(100vh - 56px);
    }

    /* SIDEBAR */
    .sidebar {
      width: 180px;
      background: rgba(10,12,18,0.55);
      border-right: 1px solid rgba(255,255,255,0.04);
      padding: 12px;
    }

    .nav {
      padding: 10px;
      font-size: 12px;
      opacity: 0.7;
      cursor: pointer;
      border-radius: 8px;
    }

    .nav:hover {
      background: rgba(0,245,255,0.08);
      opacity: 1;
    }

    /* MAIN */
    .main {
      flex: 1;
      padding: 18px;
    }

    .title {
      font-size: 13px;
      opacity: 0.7;
      margin-bottom: 14px;
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .card {
      height: 120px;
      border-radius: 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.15s;
      position: relative;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(0,245,255,0.25);
    }

    /* PAGES */
    .page {
      display: none;
    }

    .active {
      display: block;
    }

    input {
      padding: 10px;
      border-radius: 10px;
      border: none;
      background: rgba(255,255,255,0.05);
      color: white;
      margin-top: 10px;
    }

    button {
      padding: 10px 16px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: linear-gradient(90deg, #6c2bd9, #00f5ff);
      color: white;
    }

  </style>
</head>

<body>

<!-- TOP -->
<div class="topbar">
  <div class="logo" onclick="go('home')">AETHERBET</div>
  <div class="wallet">Balance: <span id="bal">100</span></div>
</div>

<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="nav" onclick="go('home')">Home</div>
    <div class="nav" onclick="go('dice')">Dice</div>
    <div class="nav" onclick="go('crash')">Crash</div>
    <div class="nav" onclick="go('slots')">Slots</div>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- HOME -->
    <div id="home" class="page active">
      <div class="title">Games</div>

      <div class="grid">
        <div class="card" onclick="go('dice')">🎲 Dice</div>
        <div class="card" onclick="go('crash')">🚀 Crash</div>
        <div class="card" onclick="go('slots')">🎰 Slots</div>
      </div>
    </div>

    <!-- DICE -->
    <div id="dice" class="page">
      <h2>Dice</h2>
      <input id="bet" type="number" placeholder="Bet">
      <button onclick="dice()">Roll</button>
      <p id="diceRes"></p>
    </div>

    <!-- CRASH -->
    <div id="crash" class="page">
      <h2>Crash</h2>
      <button onclick="crash()">Start</button>
      <p id="crashRes"></p>
    </div>

    <!-- SLOTS -->
    <div id="slots" class="page">
      <h2>Slots</h2>
      <button onclick="slots()">Spin</button>
      <p id="slotsRes"></p>
    </div>

  </div>
</div>

<script>
let balance = 100;

function go(page) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(page).classList.add("active");
}

/* DICE */
function dice() {
  let bet = Number(document.getElementById("bet").value);
  let roll = Math.floor(Math.random() * 100);

  if (!bet) return;

  if (roll < 50) {
    balance += bet;
    document.getElementById("diceRes").innerText = "WIN " + roll;
  } else {
    balance -= bet;
    document.getElementById("diceRes").innerText = "LOSE " + roll;
  }

  document.getElementById("bal").innerText = balance;
}

/* CRASH */
function crash() {
  let x = (Math.random() * 5).toFixed(2);
  document.getElementById("crashRes").innerText = "x" + x;
}

/* SLOTS */
function slots() {
  let s = ["🍒","💎","7","🍋"];
  let r = s[Math.floor(Math.random()*s.length)];
  document.getElementById("slotsRes").innerText = r + r + r;
}
</script>

</body>
</html>
