<!DOCTYPE html>
<html>
<head>
  <title>AetherBet</title>

  <style>
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(0,245,255,0.08), transparent 35%),
        radial-gradient(circle at 80% 20%, rgba(108,43,217,0.10), transparent 40%),
        #05060a;
      color: white;
    }

    /* TOP BAR */
    .topbar {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: rgba(10,12,18,0.75);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .logo {
      font-weight: 700;
      letter-spacing: 3px;
      color: #00f5ff;
      font-size: 13px;
    }

    .balance {
      font-size: 12px;
      opacity: 0.8;
    }

    /* LAYOUT */
    .wrap {
      display: flex;
      height: calc(100vh - 56px);
    }

    /* SIDEBAR */
    .sidebar {
      width: 180px;
      padding: 14px;
      background: rgba(10,12,18,0.55);
      border-right: 1px solid rgba(255,255,255,0.04);
      backdrop-filter: blur(14px);
    }

    .nav {
      font-size: 12px;
      padding: 10px;
      margin-bottom: 6px;
      border-radius: 8px;
      opacity: 0.7;
      cursor: pointer;
      transition: 0.15s;
    }

    .nav:hover {
      background: rgba(0,245,255,0.08);
      opacity: 1;
    }

    /* MAIN */
    .main {
      flex: 1;
      padding: 18px;
    }

    .title {
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 14px;
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .card {
      height: 120px;
      border-radius: 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      opacity: 0.85;
      cursor: pointer;
      transition: 0.18s;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(0,245,255,0.25);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      opacity: 1;
    }

    /* subtle glow strip */
    .card::before {
      content: "";
      position: absolute;
      width: 100%;
      height: 2px;
      top: 0;
      left: 0;
      background: linear-gradient(90deg, #6c2bd9, #00f5ff);
      opacity: 0.6;
    }

    /* RIGHT */
    .right {
      width: 200px;
      padding: 14px;
      background: rgba(10,12,18,0.55);
      border-left: 1px solid rgba(255,255,255,0.04);
      backdrop-filter: blur(14px);
    }

    .live-title {
      font-size: 12px;
      opacity: 0.6;
      margin-bottom: 10px;
    }

    .live {
      font-size: 11px;
      opacity: 0.6;
      margin: 8px 0;
    }
  </style>
</head>

<body>

  <!-- TOP -->
  <div class="topbar">
    <div class="logo">AETHERBET</div>
    <div class="balance">Balance: 100</div>
  </div>

  <!-- BODY -->
  <div class="wrap">

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="nav">Home</div>
      <div class="nav">Dice</div>
      <div class="nav">Crash</div>
      <div class="nav">Slots</div>
      <div class="nav">Plinko</div>
    </div>

    <!-- MAIN -->
    <div class="main">
      <div class="title">Games</div>

      <div class="grid">
        <div class="card">🎲 Dice</div>
        <div class="card">🚀 Crash</div>
        <div class="card">🎰 Slots</div>
        <div class="card">⚡ Plinko</div>
        <div class="card">🌌 Roulette</div>
        <div class="card">🪐 Mines</div>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="right">
      <div class="live-title">Live Activity</div>
      <div class="live">Nova won 2.1x</div>
      <div class="live">Astra hit 4.8x</div>
      <div class="live">Void won 1.6x</div>
    </div>

  </div>

</body>
</html>
